<div class="vscode-layout">
  <app-title-bar />
  
  <div class="vscode-main-body">
    <div class="editor-section">
      <app-activity-bar (viewChange)="switchView($event)" [activeView]="activeView()" />
      
      <!-- Explorer View -->
      @if (activeView() === 'explorer') {
        <app-sidebar />
      }
      
      <!-- Search View -->
      @if (activeView() === 'search') {
        <app-search-panel />
      }
      
      <!-- Editor Area with Active Tab Content -->
      <app-editor 
        [activeTab]="activeTab()" />
    </div>
  </div>

  <app-status-bar />

  <!-- AI Copilot Chat Widget -->
  <app-chat-widget />
</div>
