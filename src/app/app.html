<div class="vscode-layout">
  <app-title-bar />

  <div class="vscode-main-body">
    <div class="editor-section">
      <app-activity-bar (viewChange)="switchView($event)" [activeView]="activeView()" />

      @if (activeView() === 'explorer') {
        <app-explorer-panel />
      }
      @if (activeView() === 'search') {
        <app-search-panel />
      }
      @if (activeView() === 'news') {
        <app-source-control />
      }
      @if (activeView() === 'settings') {
        <app-settings-panel />
      }
    </div>
  </div>

  <app-status-bar />
  <app-chat-widget />
</div>
