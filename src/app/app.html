<div class="vscode-layout">
  <app-title-bar />

  <div class="vscode-main-body">
    <div class="editor-section">
      <app-activity-bar
        (viewChange)="switchView($event)"
        [activeView]="activeView()"
        [chatOpen]="chatOpen()"
        (chatToggle)="toggleChat()" />

      <div class="sidebar-panel">
        @if (activeView() === 'explorer') {
          <app-explorer-panel />
        }
        @if (activeView() === 'search') {
          <app-search-panel />
        }
        @if (activeView() === 'news') {
          <app-source-control />
        }
        @if (activeView() === 'settings') {
          <app-settings-panel />
        }
      </div>

      @if (chatOpen()) {
        <div class="chat-right-panel">
          <app-chat-widget [sidebarMode]="true" />
        </div>
      }
    </div>
  </div>

  <app-status-bar />
</div>
