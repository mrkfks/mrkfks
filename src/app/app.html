<div class="vscode-layout">
  <app-title-bar />
  
  <div class="vscode-main-body">
    <div class="editor-section">
      <app-activity-bar (viewChange)="switchView($event)" [activeView]="activeView()" />
      
      <!-- Explorer View -->
      @if (activeView() === 'explorer') {
        <app-sidebar 
          (fileSelect)="onFileSelect($event)" />
      }
      
      <!-- Search View -->
      @if (activeView() === 'search') {
        <app-search-panel 
          (fileSelect)="onFileSelect($event)" />
      }
      
      <!-- EditorArea seçilen dosyayı gösterir -->
      <app-editor 
        [selectedFilePath]="selectedFilePath()"
        [selectedFileContent]="selectedFileContent()" />
    </div>

    <!-- Chat Panel (Sağ Tarafta) -->
    <app-chat />
  </div>

  <app-status-bar />
</div>
