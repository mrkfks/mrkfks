<div class="vscode-layout">
  <app-title-bar />

  <div class="vscode-main-body">
    <div class="editor-section">
      <app-activity-bar
        (viewChange)="switchView($event)"
        [activeView]="activeView()"
        [sidebarOpen]="sidebarOpen()" />

      <!-- Mobile backdrop -->
      @if (isMobile() && sidebarOpen()) {
        <div class="mobile-backdrop" (click)="closeSidebar()"></div>
      }

      <div class="sidebar-panel" [class.mobile-open]="sidebarOpen()">
        @if (activeView() === 'explorer') {
          <app-explorer-panel />
        }
        @if (activeView() === 'search') {
          <app-search-panel />
        }
        @if (activeView() === 'news') {
          <app-source-control />
        }
        @if (activeView() === 'settings') {
          <app-settings-panel />
        }
      </div>

      <div class="editor-area">
        @if (tabService.activeTab$()) {
          <app-markdown-card
            [filePath]="tabService.activeTab$()!.name"
            [content]="tabService.activeTab$()!.content ?? ''"
            [loading]="tabService.activeTab$()!.isLoading ?? false"
            (closed)="tabService.closeTab(tabService.activeTab$()!.id)">
          </app-markdown-card>
        } @else {
          <div class="editor-empty">
            <span>Bir dosya seçin</span>
          </div>
        }
      </div>

      <div class="chat-right-panel">
        <app-chat-widget [sidebarMode]="true" />
      </div>
    </div>
  </div>

  <app-status-bar />
</div>
